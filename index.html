<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صفحة saqrloveyeo الشخصية</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    text-align: center;
  }
  .avatar {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: #667eea;
    color: #fff;
    font-size: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  h1 { color: #2c3e50; font-size: 26px; margin-bottom: 8px; }
  .subtitle { color: #7f8c8d; font-size: 15px; margin-bottom: 25px; }
  .links { display: flex; gap: 12px; justify-content: center; margin-bottom: 30px; }
  .links a {
    text-decoration: none;
    color: #667eea;
    font-size: 14px;
    border: 1px solid #667eea;
    padding: 6px 14px;
    border-radius: 20px;
    transition: 0.2s;
  }
  .links a:hover { background: #667eea; color: #fff; }
  form { text-align: right; }
  label { display: block; font-size: 14px; color: #555; margin-bottom: 6px; margin-top: 14px; }
  input, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    background: #f9f9f9;
    transition: 0.2s;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #667eea;
    background: #fff;
  }
  textarea { resize: vertical; min-height: 100px; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { opacity: 0.9; transform: translateY(-1px); }
  .note { font-size: 12px; color: #aaa; margin-top: 18px; }
</style>
</head>
<body>

<div class="card">
  <div class="avatar">S</div>

  <h1>اسمك هنا</h1>
  <p class="subtitle">مصمم / مطور / أي لقب تريده</p>

  <div class="links">
    <a href="https://wa.me/966000000000" target="_blank">واتساب</a>
    <a href="mailto:saqr2503@gmail.com">بريد</a>
  </div>

  <form action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">
    <input type="hidden" name="subject" value="رسالة جديدة من صفحتي">
    
    <label for="name">اسمك</label>
    <input type="text" id="name" name="name" placeholder="اكتب اسمك" required>

    <label for="email">بريدك الإلكتروني</label>
    <input type="email" id="email" name="email" placeholder="example@mail.com" required>

    <label for="message">رسالتك</label>
    <textarea id="message" name="message" placeholder="اكتب رسالتك هنا..." required></textarea>

    <button type="submit">إرسال الرسالة</button>
  </form>

  <p class="note">سيتم إرسال رسالتك مباشرة إلى بريدي الإلكتروني</p>
</div>

</body>
</html>
